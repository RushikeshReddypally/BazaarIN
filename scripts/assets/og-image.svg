<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22223b"/>
      <stop offset="100%" stop-color="#3d3a5c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle corner rings, matching the site's hero decoration -->
  <circle cx="1080" cy="120" r="220" fill="none" stroke="#4a4e69" stroke-width="1.5" opacity="0.35"/>
  <circle cx="1080" cy="120" r="320" fill="none" stroke="#4a4e69" stroke-width="1.5" opacity="0.2"/>
  <circle cx="90" cy="560" r="160" fill="none" stroke="#9a8c98" stroke-width="1.5" opacity="0.25"/>

  <!-- Wordmark -->
  <text x="90" y="300" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="800" fill="#ffffff" letter-spacing="-2">BazaarTrade<tspan fill="#e8473f">.</tspan>in</text>

  <!-- Tagline -->
  <text x="92" y="365" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="500" fill="#c9ada7">Buy &amp; Sell Anything Across India for Free</text>

  <!-- Category chips -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#22223b">
    <rect x="92" y="420" width="140" height="52" rx="26" fill="#ffffff"/>
    <text x="122" y="453">Cars</text>

    <rect x="248" y="420" width="180" height="52" rx="26" fill="#ffffff"/>
    <text x="278" y="453">Mobiles</text>

    <rect x="444" y="420" width="190" height="52" rx="26" fill="#ffffff"/>
    <text x="474" y="453">Property</text>

    <rect x="650" y="420" width="200" height="52" rx="26" fill="#e8473f"/>
    <text x="680" y="453" fill="#ffffff">+ More</text>
  </g>
</svg>
